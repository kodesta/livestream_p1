<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- Sign Up Modal -->
  <div id="signup-modal" class="signup-modal" style="display: none;">
    <div class="signup-overlay" id="signup-overlay"></div>
    <div class="signup-container">
      <div class="signup-header">
        <h2 class="signup-logo"><img src="./uploads/imgs/live.png"  class="livestream-logo"/></h2>
        <button id="signup-close-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="signup-body">
        <h3>Log in</h3>
        <p class="signup-subtitle">Log in to continue streams.</p>

        <form id="signup-form">
          
          <div class="input-group">
            <label for="signup-email">Email Address</label>
            <input type="email" id="signup-email" required placeholder="john@example.com">
          </div>
          <div class="input-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required placeholder="••••••••">
          </div>
          <button type="submit" class="signup-submit-btn">CLogin</button>
        </form>
        <div class="social-divider">
          <span>Or log in with</span>
        </div>

        <div class="social-buttons">
          <button class="social-btn google-btn"><a><i class="fa-brands fa-google"></i></a> Google</button>
          <button class="social-btn facebook-btn"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
        </div>
        
      </div>
    </div>
  </div>
</body>
</html>
