<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Upload Stream Content</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="new.css">
  
</head>
<body class="admin-page">

    <header class="app-header">
    <div class="header-left">
      <a href="/" class="brand-logo"><img src="./uploads/imgs/live.png"  class="livestream-logo"/></a>
    </div>
    <div class="header-right">
      <a href="/" class="back-home-btn">
        <i class="fa-solid fa-arrow-left-long"></i>
        <span>Back to Livestream</span>
      </a>
    </div>
  </header>

  <main class="admin-container">
    <div class="admin-header-row">
      <h2 class="admin-title">Upload Content Dashboard</h2>
      <span class="catalog-count"><i class="fa-solid fa-shield-halved"></i> Admin Mode</span>
    </div>
    <form id="upload-form" enctype="multipart/form-data">
      <div class="form-grid">

        <!-- Title -->
        <div class="form-group full-width">
          <label for="title">Title *</label>
          <input type="text" id="title" name="title" required placeholder="e.g. Inception">
        </div>
        <!-- Type -->
        <div class="form-group">
          <label for="type">Category Type *</label>
          <select id="type" name="type" required>
            <option value="Movie" class="options">Movie</option>
            <option value="TV Show" class="options">TV Show</option>
          </select>
        </div>
    <!-- Release Date -->
        <div class="form-group">
          <label for="releaseDate">Release Date</label>
          <input type="date" id="releaseDate" name="releaseDate">
        </div>
        <!-- Actors -->
        <div class="form-group">
          <label for="actors">Principal Actors (comma separated)</label>
          <input type="text" id="actors" name="actors" placeholder="Leonardo DiCaprio, Joseph Gordon-Levitt">
        </div>
        <!-- Studio -->
        <div class="form-group">
          <label for="studio">Production Studio</label>
          <input type="text" id="studio" name="studio" placeholder="Warner Bros. Pictures">
        </div>
        <!-- Country of Origin -->
        <div class="form-group">
          <label for="country">Country of Origin</label>
          <select id="country" name="country">
            <option value="United States" class="options">United States</option>
            <option value="United Kingdom" class="options">United Kingdom</option>
            <option value="Japan" class="options">Japan</option>
            <option value="France" class="options">France</option>
            <option value="South Korea" class="options">South Korea</option>
            <option value="Netherlands" class="options">Netherlands</option>
            <option value="Canada" class="options">Canada</option>
          </select>
        </div>

        <!-- Genres -->
        <div class="form-group">
          <label for="genres">Genres (comma separated)</label>
          <input type="text" id="genres" name="genres" placeholder="Sci-Fi, Action, Thriller">
        </div>
        <!-- Rating -->
        <div class="form-group">
          <label for="rating">Initial Rating (1.0 to 5.0)</label>
          <input type="number" id="rating" name="rating" min="1" max="5" step="0.1" value="4.0">
        </div>
        <!-- Poster Image Source Selection -->
        <div class="form-group full-width">
          <label>Poster Image Source</label>
          <div class="source-selection">
            <span class="source-tab active" id="poster-tab-url">URL Link</span>
            <span class="source-tab" id="poster-tab-file">File Upload</span>
          </div>
          <!-- Poster URL Input -->
          <div id="poster-url-container">
            <input type="text" id="posterUrl" name="posterUrl" placeholder="https://domain.com/poster.jpg">
          </div>
          <!-- Poster File Input -->
          <div id="poster-file-container" style="display: none;">
            <div class="file-input-wrapper">
              <i class="fa-solid fa-image"></i>
              <p>Drag or browse cover image file</p>
              <input type="file" id="posterFile" name="posterFile" accept="image/*">
            </div>
            <p id="poster-file-name" style="font-size: 0.8rem; color: var(--accent-purple); margin-top: 4px; display: none;"></p>
          </div>
        </div>

    <!-- Video Source Selection -->
        <div class="form-group full-width">
          <label>Video Stream Source</label>
          <div class="source-selection">
            <span class="source-tab active" id="video-tab-url">URL Link / Stream</span>
            <span class="source-tab" id="video-tab-file">File Upload</span>
          </div>
          <!-- Video URL Input -->
          <div id="video-url-container">
            <input type="text" id="videoUrl" name="videoUrl" placeholder="https://domain.com/movie.mp4">
          </div>
          <!-- Video File Input -->
          <div id="video-file-container" style="display: none;">
            <div class="file-input-wrapper">
              <i class="fa-solid fa-video"></i>
              <p>Drag or browse movie video file (MP4, WebM)</p>
              <input type="file" id="videoFile" name="videoFile" accept="video/*">
            </div>
            <p id="video-file-name" style="font-size: 0.8rem; color: var(--accent-indigo); margin-top: 4px; display: none;"></p>
          </div>
        </div>
        <!-- Description -->
        <div class="form-group full-width">
          <label for="description">Summary Description</label>
          <textarea id="description" name="description" rows="4" placeholder="Brief outline of the movie or series plot..."></textarea>
        </div>
        <div class="form-group full-width">
          <button type="submit" class="upload-btn">
            <i class="fa-solid fa-rocket"></i>
            <span>Publish to Livestream</span>
          </button>
        </div>
      </div>
    </form>

    <!-- Upload Progress indicator -->
    <div class="upload-progress-container" id="progress-container">
      <div class="progress-header">
        <span id="progress-status">Uploading files...</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-bar" id="progress-bar"></div>
      </div>
    </div>
    <!-- Status Message Alert box -->
    <div class="status-msg" id="status-box"></div>
  </main>

  <!-- Shared Site Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-left">
        <span class="footer-copy">&copy; 2026 Livestream. All rights reserved.</span>
      </div>
      <div class="footer-links">
        <a href="/terms.html" class="footer-link">Terms of Service</a>
        <span class="footer-separator">•</span>
        <a href="/privacy.html" class="footer-link">Privacy Policy</a>
        <span class="footer-separator">•</span>
        <a href="mailto:contact@livestream.com" class="footer-link"><i class="fa-regular fa-envelope"></i> Contact</a>
      </div>
    </div>
  </footer>

  <script src="admin.js"></script>

</body>
</html>
